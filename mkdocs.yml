site_name: CVBench
site_description: GPU-enabled computer vision training sandbox — Keras + TensorFlow + JupyterLab in one container.
site_url: https://mmgalushka.github.io/cvbench/
repo_name: mmgalushka/cvbench
repo_url: https://github.com/mmgalushka/cvbench
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - CLI reference: cli-reference.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
