site_name: CVBench
site_description: GPU-enabled computer vision training sandbox — Keras + TensorFlow + JupyterLab in one container.
site_url: https://mmgalushka.github.io/cvbench/
repo_name: mmgalushka/cvbench
repo_url: https://github.com/mmgalushka/cvbench
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Installation & Volumes: getting-started/installation.md
      - Your First Model: getting-started/first-model.md
  - Data:
      - Generating Synthetic Data: data/synthetic.md
      - Preparing Real Datasets: data/prepare.md
      - Augmentation: data/augmentation.md
  - Training:
      - Training Basics: training/basics.md
      - Optimizer & Loss: training/optimizer-loss.md
      - Learning Rate Scheduling: training/lr-scheduling.md
      - Two-Phase Training: training/two-phase.md
  - Evaluation & Prediction:
      - Evaluating a Run: evaluation/evaluate.md
      - Running Predictions: evaluation/predict.md
  - Tools:
      - Sessions (tmux): tools/tmux.md
      - Experiment Tracker: tools/experiment-tracker.md
      - JupyterLab: tools/jupyter-notebook.md
  - Deployment & Export:
      - Export Formats (TFLite/ONNX): deployment/export.md
      - Hailo HEF Export: deployment/hailo.md
      - Jetson Deployment: deployment/jetson.md
  - CLI Reference: cli-reference.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - mkdocs-click

plugins:
  - search
